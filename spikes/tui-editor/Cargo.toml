[package]
name = "tui-editor-spike"
version = "0.0.0"
edition = "2024"
publish = false
description = "Spike: can ratatui + crossterm carry Kalem's terminal frontend? (tasks T0.8, decision D14)"

[workspace]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
ratatui-image = "11.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
org-syntax = { path = "../../crates/org-syntax" }
unicode-width = "0.2"
unicode-segmentation = "1"
ratex-parser = "0.1.14"
ratex-layout = "0.1.14"
ratex-types = "0.1.14"
ratex-svg = { version = "0.1.14", features = ["standalone", "embed-fonts"] }
resvg = { version = "0.45", default-features = false }
libc = "0.2"

[profile.release]
strip = true
