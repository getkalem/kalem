[package]
name = "gpui-rich-text"
description = "Rich text lines for editors on gpui: inline layout of styled text with widget boxes, row breaking with hanging indents, carets, hit testing and selection rectangles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["gpui", "editor", "rich-text", "layout", "text"]
categories = ["gui", "text-editors"]
readme = "README.md"
# Its gpui is `gpui-unofficial` (a snapshot of Zed's release tags, renamed
# `gpui` in the workspace); published once the name is settled.
publish = false

[dependencies]
gpui.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
