# The plugins Kalem has built in (wasm_todo W9): components released by
# getkalem/plugins, each pinned by its release's tag and the SHA-256 of
# its component and of its manifest. With the feature `embed`, the build
# downloads them from the release (or reads them from the folder named
# by KALEM_COMPONENTS_DIR: the component as `file`, the manifest as
# `FILE-STEM.plugin.json`), checks them, and keeps them compressed in the
# binary. A plugin release reaches Kalem by changing its entry here.

repository = "getkalem/plugins"

