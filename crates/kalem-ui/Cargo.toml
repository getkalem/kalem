[package]
name = "kalem-ui"
description = "The graphical frontend of the Kalem editor, on gpui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
kalem-core = { workspace = true, features = ["svg-text"] }
kalem-viewer.workspace = true
kalem-highlight.workspace = true
gpui-rich-text.workspace = true
org-math.workspace = true
image = { version = "0.25", default-features = false }
org-syntax.workspace = true
org-edit.workspace = true
org-model.workspace = true
# gpui with AccessKit (T1.5.2b), from crates.io: `gpui-unofficial`, a
# snapshot of a Zed release tag (the workspace Cargo.toml, R2.7).
gpui.workspace = true
gpui_platform = { workspace = true, features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
serde_json = "1"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system"] }
tracing = "0.1"
unicode-segmentation = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSApplication", "NSResponder", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData"] }

[dev-dependencies]
# The terminal editor, for the tests comparing the two editors.
kalem-tui.workspace = true
# Pictures, PDF files and workbooks open with the bundled plugins, the
# components Kalem builds in (wasm_todo W7, W9).
kalem-components = { workspace = true, features = ["embed", "viewers"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
unicode-width = "0.2"
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }

# A benchmark with its own `main`: the system's text system is created on
# the main thread. It runs only with `--ignored`.
[[test]]
name = "latency"
harness = false

[lints]
workspace = true
