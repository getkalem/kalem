[package]
name = "kalem-editor"
description = "Kalem: a fast, text-first editor that opens every plain-text format as itself and keeps it byte for byte (Org, Markdown, LaTeX, CSV, BibTeX, code), for the desktop and the terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["org-mode", "editor", "wysiwyg", "latex", "tui"]
categories = ["text-editors", "command-line-utilities"]
readme = "../../README.md"
# Not on crates.io yet: it depends on kalem-core, which cannot be
# published; the binaries are the distribution (docs/releasing.md).
publish = false

[[bin]]
name = "kalem"
path = "src/main.rs"

[features]
default = ["gui", "tui", "plugins"]
# The graphical editor (gpui). Without it: the terminal-only build, for
# servers and minimal systems (`--no-default-features --features tui`),
# which leaves out the bundled viewers and the plugin host too unless
# named.
gui = ["dep:kalem-ui"]
# The terminal editor.
tui = ["dep:kalem-tui"]
# The plugin host (Wasmtime) for installed component plugins.
plugins = ["kalem-cli/plugins"]
# The viewers of pictures, PDF files and workbooks built into the binary:
# the components getkalem/plugins released, pinned in crates/kalem-
# components/components.toml (wasm_todo W9). Off by default and in every
# release (owner, 2026-10-10): beyond the small core, a plugin is
# installed when it is wanted, from the plugin list or when a file needs
# it. For a build of one's own and the tests that check the choice
# between a built-in copy and an installed one.
components = ["kalem-cli/components"]

[dependencies]
kalem-cli.workspace = true
kalem-tui = { workspace = true, optional = true }
kalem-ui = { workspace = true, optional = true }

[package.metadata.dist]
dist = true

[lints]
workspace = true

[dev-dependencies]
insta = { version = "1", features = ["json"] }
serde_json = "1"
