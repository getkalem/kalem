# Every extension point of the design document's §11.10 to §11.13, and
# where it stands in the WIT definition: `interface` names the WIT
# interface that defines it, `planned` the open task that will. The test
# `tests/coverage.rs` checks both, and that no point of the design is
# missing here.

[[point]]
name = "Commands, keybindings"
interface = "kalem"

[[point]]
name = "Link types"
planned = "T3.1.9a"

[[point]]
name = "Block renderers"
planned = "T3.1.9b"

[[point]]
name = "Decorations"
# Gutter marks (API 0.2.5); lines a layer draws under lines (API 0.2.13,
# `layer-2`), typed into in place where they show a file's text (API
# 0.2.15, `layer-3`), as an outline where they start a file's blocks (API
# 0.2.18, `layer-4`); text at places of a line (API 0.2.20, `layer-5`);
# highlights and badges within a line are T3.1.9c's rest.
interface = "decorations"

[[point]]
name = "Completers and hover"
# Completers (API 0.2.11); hover is T3.1.9c's rest.
interface = "completer"

[[point]]
name = "Input rules"
planned = "T3.1.9c"

[[point]]
name = "Highlighters and document modes"
planned = "T3.1.9g"

[[point]]
name = "Views"
planned = "T3.1.9d"

[[point]]
name = "Panels"
interface = "ui"

[[point]]
name = "Diagnostics"
# A plugin's problems in files (API 0.2.14); checks `kalem check` runs
# and fixes are T3.1.9e's rest.
interface = "problems"

[[point]]
name = "Export backends and filters"
planned = "T3.1.8"

[[point]]
name = "Importers, paste handlers"
planned = "T3.1.9e"

[[point]]
name = "Babel languages"
# Executors (API 0.2.21): a plugin's languages' source blocks run.
interface = "executor"

[[point]]
name = "Table functions"
planned = "T3.1.8"

[[point]]
name = "Dynamic blocks"
planned = "T3.1.9d"

[[point]]
name = "Agenda views, capture templates"
planned = "T3.1.9f"

[[point]]
name = "CLI subcommands"
planned = "T3.1.9f"

[[point]]
name = "Themes"
planned = "T3.1.9f"

# §11.13.
[[point]]
name = "Viewers and editors of files that are not text"
interface = "viewer"

[[point]]
name = "Grids of spreadsheets and databases"
interface = "grid"
