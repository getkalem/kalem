[package]
name = "kalem-plugin"
description = "The API of Kalem editor plugins: the WIT definition and the Rust bindings a plugin builds against (D6, D28)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# The WIT files travel with the crate: they are the definition.
include = ["src/", "wit/", "coverage.toml", "README.md"]

[dependencies]
wit-bindgen = "0.57"
# The Rust contract a viewer implements, adapted to the WIT world.
kalem-viewer.workspace = true

[features]
# The `spreadsheet-viewer` world: a viewer of sheets of cells exports the
# `grid` interface too (T3.7.4).
grid = []
# The `flow-viewer` world: a viewer of documents of flowing text exports
# the `flow` interface too (API 0.2.7). With `grid`, the `full-viewer`
# world, which exports both.
flow = []
# The `extension-layer` world: an extension plugin exporting the `layer`
# interface too, layers over a mode's view (API 0.2.10).
layer = []
# The `extension-completer` world: an extension plugin exporting the
# `completer` interface too, completion at the cursor (API 0.2.11), and
# `layer` (none unless it answers `overlays`).
completer = ["layer"]
# The `extension-layer-2` world: an extension plugin exporting the
# `layer-2` interface too, layers with lines of their own under a line
# (API 0.2.13), which the editor asks in place of `layer`.
layer-2 = ["completer"]
# The `extension-layer-3` world: an extension plugin exporting the
# `layer-3` interface too, layers whose lines under a line may show a
# file's text, typed into in place (API 0.2.15), which the editor asks in
# place of `layer-2`.
layer-3 = ["layer-2"]
# The `extension-formatter` world: an extension plugin exporting the
# `formatter` interface too, its languages' documents formatted (API
# 0.2.16), and the interfaces above (none of them unless it answers).
formatter = ["layer-3"]
# The `extension-outline` world: an extension plugin exporting the
# `outline` interface too, its languages' documents' headings (API
# 0.2.18), and the interfaces above.
outline = ["formatter"]
# The `extension-layer-4` world: an extension plugin exporting the
# `layer-4` interface too, layers whose lines under a line start blocks of
# a file's outline, which Enter, Tab and Shift+Tab change in place (API
# 0.2.18), which the editor asks in place of `layer-3`.
layer-4 = ["outline"]
# The `extension-layer-5` world: an extension plugin exporting the
# `layer-5` interface too, layers that show text at places of a line (API
# 0.2.20), which the editor asks in place of `layer-4`.
layer-5 = ["layer-4"]
# The `extension-executor` world: an extension plugin exporting the
# `executor` interface too, its languages' source blocks run by Babel (API
# 0.2.21), and the interfaces above.
executor = ["layer-5"]

[dev-dependencies]
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }

[lints]
workspace = true
