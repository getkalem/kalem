[package]
name = "kalem-plugin"
description = "The API of Kalem editor plugins: the WIT definition and the Rust bindings a plugin builds against (D6, D28)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# The WIT files travel with the crate: they are the definition.
include = ["src/", "wit/", "coverage.toml", "README.md"]

[dependencies]
wit-bindgen = "0.62"
# The Rust contract a viewer implements, adapted to the WIT world.
kalem-viewer.workspace = true

[features]
# The `spreadsheet-viewer` world: a viewer of sheets of cells exports the
# `grid` interface too (T3.7.4).
grid = []
# The `flow-viewer` world: a viewer of documents of flowing text exports
# the `flow` interface too (API 0.2.7). With `grid`, the `full-viewer`
# world, which exports both.
flow = []

[dev-dependencies]
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }

[lints]
workspace = true
