[package]
name = "org-math"
description = "LaTeX math as images for Org mode editors: KaTeX-compatible formulas rendered with RaTeX, cached"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["org-mode", "latex", "math", "katex"]
categories = ["rendering", "text-processing"]
readme = "README.md"

[dependencies]
ratex-parser = "0.1.14"
ratex-layout = "0.1.14"
ratex-types = "0.1.14"
ratex-svg = { version = "0.1.14", features = ["standalone", "embed-fonts"] }
resvg = { version = "0.46", default-features = false }

[lints]
workspace = true

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
