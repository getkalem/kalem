[package]
name = "kalem-script"
description = "The WebAssembly host of the Kalem editor's plugins (D28): components compiled once and cached, capabilities granted by the host, a time and a memory budget per instance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# D28, decided on the spike of T3.1.0: wasmtime with Cranelift, the
# component model, nothing of WASI.
wasmtime = { version = "49", default-features = false, features = ["runtime", "component-model", "cranelift", "parallel-compilation", "std", "anyhow"] }
sha2 = "0.10"
# The user's time zone, for a viewer's `clock`.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system"] }
# The Rust contract a component viewer is offered to Kalem as.
kalem-viewer.workspace = true
# A document whose instance failed is said once in the log.
tracing = "0.1"
# A trap's backtrace with the plugin's Rust functions named (W10).
rustc-demangle = "0.1"

[dev-dependencies]
# Test components are written in the component text format.
wasmtime = { version = "49", default-features = false, features = ["wat"] }
# The test plugins' arguments.
serde_json = "1"

[lints]
workspace = true
