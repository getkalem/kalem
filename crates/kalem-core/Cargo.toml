[package]
name = "kalem-core"
description = "Editor state, commands, keymaps and settings of the Kalem editor, shared by its frontends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
unicode-normalization = "0.1"
org-syntax.workspace = true
klm-syntax.workspace = true
comrak.workspace = true
org-model.workspace = true
org-cite.workspace = true
org-edit.workspace = true
latex-syntax.workspace = true
latex-model.workspace = true
org-table.workspace = true
kalem-project.workspace = true
kalem-fs.workspace = true
org-export.workspace = true
org-math.workspace = true
jiff = { version = "0.2", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
resvg = { version = "0.45", default-features = false }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
serde_json = "1"
fluent-bundle = "0.16"
unic-langid = "0.9"
sys-locale = "0.3"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
unicode-segmentation = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }

encoding_rs = "0.8"
unicode-width = "0.2"
chardetng = "0.1"
unicode_names2 = "4"
emojis = "0.9"

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
