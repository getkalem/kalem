[package]
name = "kalem-cli"
description = "Command-line subcommands and batch mode for the Kalem editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
org-syntax.workspace = true
klm-syntax.workspace = true
org-cite.workspace = true
org-model.workspace = true
org-edit.workspace = true
kalem-lsp.workspace = true
org-table.workspace = true
org-export.workspace = true
kalem-core.workspace = true
# `book/chapters.toml`, the code each chapter describes.
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
kalem-plugin-image-viewer.workspace = true
kalem-plugin-xlsx.workspace = true
kalem-plugin-pdf-viewer.workspace = true
# Component viewers installed by the user (D28, T3.1.12).
kalem-script.workspace = true
latex-syntax.workspace = true
latex-model.workspace = true
jiff = "0.2"
clap = { version = "4", features = ["derive"] }
# Plugins' requests (`kalem.net`).
ureq = "3"
serde_json = { version = "1", features = ["unbounded_depth"] }
stacker = "0.1"
serde = "1"
serde_stacker = "0.1"

[lints]
workspace = true

[dev-dependencies]
# The viewer contract, for comparing the xlsx component with the bundled plugin.
kalem-viewer.workspace = true
