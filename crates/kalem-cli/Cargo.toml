[package]
name = "kalem-cli"
description = "Command-line subcommands and batch mode for the Kalem editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["plugins", "components"]
# The plugin host (Wasmtime): installed component plugins run.
plugins = ["dep:kalem-script", "dep:kalem-components", "kalem-components/viewers", "dep:kalem-viewer"]
# The bundled plugins, the viewers of pictures, PDF files and workbooks:
# the components getkalem/plugins released, pinned in
# crates/kalem-components/components.toml and built into the binary
# (wasm_todo W9).
components = ["plugins", "kalem-components/embed"]

[dependencies]
org-syntax.workspace = true
org-cite.workspace = true
org-model.workspace = true
org-edit.workspace = true
kalem-lsp.workspace = true
org-table.workspace = true
org-export.workspace = true
kalem-core.workspace = true
# `book/chapters.toml`, the code each chapter describes.
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
# Component viewers installed by the user (D28, T3.1.12).
kalem-script = { workspace = true, optional = true }
kalem-components = { workspace = true, optional = true }
# The viewer contract, for the viewers a component viewer stands in for.
kalem-viewer = { workspace = true, optional = true }
latex-syntax.workspace = true
latex-model.workspace = true
jiff = "0.2"
clap = { version = "4", features = ["derive"] }
# Plugins' requests (`kalem.net`).
ureq = "3"
serde_json = { version = "1", features = ["unbounded_depth"] }
stacker = "0.1"
serde = "1"
serde_stacker = "0.1"
# A plugin's stops logged with its version (wasm_todo W8).
tracing = "0.1"

[lints]
workspace = true

[dev-dependencies]
# The viewer contract, for the components' documents.
kalem-viewer.workspace = true
# A large picture made for measuring the image viewer's component.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }

# A component built for another API, and the built-in one in its place.
[[test]]
name = "xlsx_component"
required-features = ["components"]

# wasm_todo W6: the bundled components measured, each with its ceiling.
[[test]]
name = "component_speed"
required-features = ["components"]
