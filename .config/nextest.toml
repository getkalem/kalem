# cargo-nextest, which runs CI's test jobs (docs/ci_todo.md, C4): every
# test of every binary in one pool, as many at once as there are cores,
# each in a process of its own. `cargo test` works as before.
#
#     cargo nextest run --workspace
#
# Doc tests are not nextest's: `cargo test --workspace --doc`. A test
# target with `harness = false` must answer `--list` as libtest does, or
# nextest cannot run the workspace: see `main` in
# crates/kalem-lsp/tests/fake_server.rs.

[profile.default]
# Name the tests slower than a minute; they still run to the end.
slow-timeout = { period = "60s" }

# kalem-cli's component_speed holds measurements to ceilings (wasm_todo
# W6): no other test runs beside it, and its numbers are in the log.
[[profile.default.overrides]]
filter = 'package(kalem-cli) & binary(component_speed)'
threads-required = 'num-test-threads'
success-output = 'immediate'

# CI: every test runs, and the output of the failures is repeated at the
# end of the log. A failed test runs twice more: a few tests wait a
# second or two for a thread of the editor's, and a runner with every
# core busy (on Windows `this_file_keys` and `code_completions_taken`,
# docs/ci_todo.md, C4) can miss that; the log names a test that passes
# on a second try FLAKY.
[profile.ci]
fail-fast = false
failure-output = "immediate-final"
retries = 2
