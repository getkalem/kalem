# The terminal-only archives (docs/releasing.md): the `tui` feature alone,
# without windowing or GPU libraries, for servers and minimal systems.
# cargo-dist builds one configuration per package, so these are built
# here: called by the release workflow once the release is announced
# (`post-announce-jobs` in Cargo.toml), or by hand from the Actions tab
# for a release that exists.
name: Release (terminal-only)

on:
  workflow_call:
    inputs:
      plan:
        description: "dist's plan of the release, as JSON"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "The release to attach the archives to (v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            # As cargo-dist builds for Windows: no MSVC runtime to install.
            rustflags: "-C target-feature=+crt-static"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - name: The release's tag
        shell: bash
        env:
          TAG_INPUT: ${{ inputs.tag }}
          PLAN: ${{ inputs.plan }}
        run: |
          tag="$TAG_INPUT"
          if [ -z "$tag" ]; then
            tag=$(printf '%s' "$PLAN" | jq -r .announcement_tag)
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --profile dist --locked -p kalem-editor --no-default-features --features tui
      - name: Archive and checksum
        shell: bash
        run: |
          name="kalem-terminal-${{ matrix.target }}"
          mkdir "$name"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "$name/"
          if [ -f target/dist/kalem.exe ]; then
            cp target/dist/kalem.exe "$name/"
            7z a "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            cp target/dist/kalem "$name/"
            tar cJf "$name.tar.xz" "$name"
            archive="$name.tar.xz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Attach to the release
        shell: bash
        run: gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber --repo "${{ github.repository }}"
