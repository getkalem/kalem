name: CI

on:
  push:
    branches: [main]
  pull_request:

# A pull request's new push cancels its old run. On main every run is
# let finish (a newer push waits behind it), so main always has a
# completed result; with cancel-in-progress there, frequent pushes left
# no run on main finishing at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: The bundled plugins at one revision
        run: sh tools/check-plugin-pins.sh
      - name: Nothing from Zed's repository
        run: sh tools/check-zed-deps.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries for the graphical editor (gpui)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev
      - run: cargo clippy --workspace --all-targets

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # The target and wasm-tools build the fake viewer of tests/plugins
      # into a component for kalem-script's tests of the WIT API; without
      # them those tests pass without checking.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries for the graphical editor (gpui)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev
      # The Markdown conformance tests read CommonMark's and GFM's
      # specifications (CC BY-SA 4.0, not in the repository); without them
      # they pass without checking.
      - name: CommonMark and GFM specifications
        shell: bash
        run: |
          mkdir -p spikes/md-parser/data
          curl -sSfL -o spikes/md-parser/data/commonmark-spec.txt \
            https://raw.githubusercontent.com/commonmark/commonmark-spec/0.31.2/spec.txt
          curl -sSfL -o spikes/md-parser/data/gfm-spec.txt \
            https://raw.githubusercontent.com/github/cmark-gfm/0.29.0.gfm.13/test/spec.txt
      - run: cargo test --workspace --no-fail-fast

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries for the graphical editor (gpui)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev
      - run: cargo check --workspace

  terminal-only:
    name: terminal-only build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # No windowing or GPU libraries: the build must not need them.
      - run: cargo build -p kalem-editor --no-default-features --features tui
      - name: No gpui in the dependency tree
        run: "! cargo tree -p kalem-editor --no-default-features --features tui | grep -q gpui"

  binary-size:
    name: binary size
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries for the graphical editor (gpui)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev
      # The release binaries, as cargo-dist and the terminal-only release
      # build them, against their ceilings (roadmap R2.1).
      - run: cargo build --release --locked -p kalem-editor --no-default-features --features tui
      - run: sh tools/check-binary-size.sh target/release/kalem terminal
      - run: cargo build --release --locked -p kalem-editor
      - run: sh tools/check-binary-size.sh target/release/kalem full

  fuzz:
    name: fuzz (short run)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      # rust-toolchain.toml asks for stable; the fuzzer needs nightly.
      - run: cargo +nightly fuzz run parse -- -max_total_time=120
      - run: cargo +nightly fuzz run reparse -- -max_total_time=120
      - run: cargo +nightly fuzz run latex_parse -- -max_total_time=60
      - run: cargo +nightly fuzz run latex_reparse -- -max_total_time=60

  vim:
    name: differential test against Vim
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y vim
      - run: vim --version | head -2
      # The results recorded in tests/vim/expected.json are Vim's own;
      # the test suite holds Kalem's Vim layer to them.
      - run: python3 tools/vim-expected.py --check

  pdflatex:
    name: differential test against pdflatex
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p latex-model --example labels
      - run: cargo build --release -p kalem-core --example latex_shown --example latex_edits
      # Random documents: every label numbered as pdflatex numbers it.
      - run: python3 tools/latex-numbering-fuzz.py 400 $GITHUB_RUN_NUMBER --keep latex-differences
      # Every construct once, then random lines: the rendered view's text
      # is what pdflatex typesets.
      - run: python3 tools/latex-typeset-fuzz.py --each --keep latex-differences
      - run: python3 tools/latex-typeset-fuzz.py 600 $GITHUB_RUN_NUMBER --keep latex-differences
      # Random sequences of the editing commands: the document still
      # compiles, with no new warning.
      - run: python3 tools/latex-edit-fuzz.py 150 $GITHUB_RUN_NUMBER 6 --keep latex-differences
      # SyncTeX both ways, against TeX Live's synctex program.
      - run: cargo test --release -p kalem-core --test synctex -- --nocapture
      # Kalem's builds with pdfLaTeX and Tectonic: the same PDF twice
      # with SOURCE_DATE_EPOCH, a SyncTeX file beside it.
      - name: Reproducible builds
        run: |
          curl -sSfL https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.15.0/tectonic-0.15.0-x86_64-unknown-linux-musl.tar.gz | tar xz
          PATH="$PWD:$PATH" cargo test --release -p kalem-core --test latex_compile -- --nocapture
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: latex-differences
          path: latex-differences

  emacs:
    name: differential test against Emacs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: "30.1"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p kalem-editor --no-default-features --features tui
      - name: Core corpus
        run: |
          find tests/corpus -name '*.org' -print0 | xargs -0 ./target/release/kalem diff-emacs --summary
      - name: Core corpus, document model
        run: |
          find tests/corpus -name '*.org' -print0 | xargs -0 ./target/release/kalem diff-emacs --model --summary
      - name: Extended corpus (Worg and Org)
        run: |
          tests/corpus/fetch-extended.sh
          find .cache/worg .cache/org-mode -name '*.org' -print0 | xargs -0 ./target/release/kalem diff-emacs --summary
      - name: Extended corpus, document model
        run: |
          find .cache/worg .cache/org-mode -name '*.org' -print0 | xargs -0 ./target/release/kalem diff-emacs --model --summary
      - name: Differential fuzzing
        run: python3 tools/fuzz-diff.py 5000 $GITHUB_RUN_NUMBER
