name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries for the graphical editor (gpui)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev
      - run: cargo clippy --workspace --all-targets

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries for the graphical editor (gpui)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev
      - run: cargo test --workspace --no-fail-fast

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries for the graphical editor (gpui)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev
      - run: cargo check --workspace

  terminal-only:
    name: terminal-only build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # No windowing or GPU libraries: the build must not need them.
      - run: cargo build -p kalem-editor --no-default-features --features tui
      - name: No gpui in the dependency tree
        run: "! cargo tree -p kalem-editor --no-default-features --features tui | grep -q gpui"

  fuzz:
    name: fuzz (short run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      # rust-toolchain.toml asks for stable; the fuzzer needs nightly.
      - run: cargo +nightly fuzz run parse -- -max_total_time=120
      - run: cargo +nightly fuzz run reparse -- -max_total_time=120
      - run: cargo +nightly fuzz run latex_parse -- -max_total_time=60
      - run: cargo +nightly fuzz run latex_reparse -- -max_total_time=60

  vim:
    name: differential test against Vim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y vim
      - run: vim --version | head -2
      # The results recorded in tests/vim/expected.json are Vim's own;
      # the test suite holds Kalem's Vim layer to them.
      - run: python3 tools/vim-expected.py --check

  pdflatex:
    name: differential test against pdflatex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p latex-model --example labels
      - run: cargo build --release -p kalem-core --example latex_shown
      # Random documents: every label numbered as pdflatex numbers it.
      - run: python3 tools/latex-numbering-fuzz.py 400 $GITHUB_RUN_NUMBER --keep latex-differences
      # Every construct once, then random lines: the rendered view's text
      # is what pdflatex typesets.
      - run: python3 tools/latex-typeset-fuzz.py --each --keep latex-differences
      - run: python3 tools/latex-typeset-fuzz.py 600 $GITHUB_RUN_NUMBER --keep latex-differences
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: latex-differences
          path: latex-differences

  emacs:
    name: differential test against Emacs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: "30.1"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p kalem-editor --no-default-features --features tui
      - name: Core corpus
        run: |
          find tests/corpus \( -name '*.org' -o -name '*.klm' \) -print0 | xargs -0 ./target/release/kalem diff-emacs --summary
      - name: Core corpus, document model
        run: |
          find tests/corpus \( -name '*.org' -o -name '*.klm' \) -print0 | xargs -0 ./target/release/kalem diff-emacs --model --summary
      - name: Extended corpus (Worg and Org)
        run: |
          tests/corpus/fetch-extended.sh
          find .cache/worg .cache/org-mode -name '*.org' -print0 | xargs -0 ./target/release/kalem diff-emacs --summary
      - name: Extended corpus, document model
        run: |
          find .cache/worg .cache/org-mode -name '*.org' -print0 | xargs -0 ./target/release/kalem diff-emacs --model --summary
      - name: Differential fuzzing
        run: python3 tools/fuzz-diff.py 5000 $GITHUB_RUN_NUMBER
