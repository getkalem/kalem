name: Book

# The Book (docs/design_doc2.md §10): checked on every pull request, built by
# Kalem and published to GitHub Pages on every merge to main.

on:
  push:
    branches: [main]
  # Every pull request: the chapters of the code it changes (T2.10.10).
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The base branch too, for the chapters of the changed code.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The terminal-only build: no windowing libraries needed.
      - run: cargo build --release -p kalem-editor --no-default-features --features tui
      - name: Check the Book
        run: ./target/release/kalem book check book
      # A pull request that changes the code a chapter describes changes
      # the chapter (book/chapters.toml), unless it is labeled
      # book-unchanged and its description says why.
      - name: Chapters of the changed code
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'book-unchanged')
        run: ./target/release/kalem book check book --changed "origin/${{ github.base_ref }}"
      - name: Build the Book
        run: ./target/release/kalem book build book --out _site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
