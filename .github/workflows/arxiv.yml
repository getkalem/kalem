name: arXiv coverage

# T2.7h.1: how much of a stratified sample of arXiv's LaTeX sources the
# rendered view covers. Run by hand (and monthly); about an hour, most of
# it the pause arXiv asks for between requests. The report is in the
# job's log and its artifact; the sources are not kept.

on:
  workflow_dispatch:
    inputs:
      debug_macros:
        description: "Macro names (without backslash) to trace: why formulas find them undefined"
        required: false
        default: ""
      show_errors:
        description: "Formula errors (|-separated parts) to print the prepared source of"
        required: false
        default: ""
      per_field:
        description: Papers per field
        default: "200"
      licences:
        description: "Look up each paper's licence (about 45 minutes): the CC BY ones may be committed to the corpus"
        type: boolean
        default: false
  schedule:
    - cron: "17 3 1 * *"

# Writes the sample's release (see "Keep the sample").
permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p kalem-editor --no-default-features --features tui
      - run: cargo build --release -p kalem-core --example latex_corpus
      # The sample is kept as the assets of a draft release
      # (`arxiv-sample-2024`), which only the repository's writers see:
      # arXiv's sources are not ours to redistribute. The repository's
      # Actions cache evicted it, and every run then spent hours asking
      # arXiv for it again. Restored before fetching, and uploaded again
      # only when the fetch added to it, also when arXiv stopped answering
      # partway. What the Actions cache still holds, from before the
      # release kept it, first.
      - uses: actions/cache/restore@v4
        with:
          path: .cache/arxiv
          key: arxiv-2024-${{ github.event.inputs.per_field || '200' }}-
          restore-keys: arxiv-2024-${{ github.event.inputs.per_field || '200' }}-
      - name: Restore the sample
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: sample-${{ github.event.inputs.per_field || '200' }}
        run: |
          mkdir -p .cache/arxiv
          # Published once by mistake: a draft again.
          gh release edit arxiv-sample-2024 --draft=true > /dev/null 2>&1 || true
          if gh release download arxiv-sample-2024 -p "$ASSET.tar.zst.*" -D "$RUNNER_TEMP/sample"; then
            cat "$RUNNER_TEMP"/sample/"$ASSET".tar.zst.* | tar --zstd -x -C .cache/arxiv
            rm -rf "$RUNNER_TEMP/sample"
            echo "kept=true" >> "$GITHUB_OUTPUT"
          fi
          echo "hash=$(find .cache/arxiv -type f | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Fetch the sample
        run: python3 tools/arxiv-sample.py .cache/arxiv --per-field "${{ github.event.inputs.per_field || '200' }}"
      - name: Keep the sample
        if: always() && steps.restore.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: sample-${{ github.event.inputs.per_field || '200' }}
          BEFORE: ${{ steps.restore.outputs.hash }}
          KEPT: ${{ steps.restore.outputs.kept }}
        run: |
          now=$(find .cache/arxiv -type f | sort | sha256sum | cut -c1-16)
          if [ "$KEPT" = true ] && [ "$now" = "$BEFORE" ]; then
            echo "The sample is as it was restored."
            exit 0
          fi
          gh release view arxiv-sample-2024 > /dev/null 2>&1 ||
            gh release create arxiv-sample-2024 --draft \
              --title "arXiv sample (2024)" \
              --notes "The LaTeX sources the arXiv coverage workflow measures; not a Kalem release."
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          # Release assets are at most 2 GiB each: parts of 1.9 GB.
          tar --zstd -c -C .cache/arxiv . | split -b 1900M -d -a 2 - "$out/$ASSET.tar.zst."
          old=$(gh release view arxiv-sample-2024 --json assets --jq ".assets[].name | select(startswith(\"$ASSET.tar.zst.\"))")
          for a in $old; do
            [ -e "$out/$a" ] || gh release delete-asset arxiv-sample-2024 "$a" -y
          done
          gh release upload arxiv-sample-2024 "$out"/* --clobber
      - name: Measure
        env:
          KALEM_COVERAGE_TRACE: ${{ github.event.inputs.debug_macros }}
          KALEM_COVERAGE_SHOW: ${{ github.event.inputs.show_errors }}
        run: |
          ./target/release/kalem latex-coverage .cache/arxiv > coverage.md
          cat coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
      # The page of what shows as source, from this measurement (the Book's
      # copy is regenerated from a run's report by hand).
      - name: Limitations page
        run: |
          python3 tools/latex-limitations.py coverage.md "run ${{ github.run_number }}" "$(date -u +%F)" > latex-limitations.org
      # Every file's parse gives back its bytes, every line is drawn, and
      # random edits reparsed incrementally equal a full parse (T2.7h.31).
      - name: Round trip
        run: |
          EDITS=5 ./target/release/examples/latex_corpus .cache/arxiv > roundtrip.txt 2>&1 || status=$?
          tail -n 40 roundtrip.txt
          { echo; echo '## Round trip and incremental parse'; echo; echo '```'; tail -n 20 roundtrip.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit ${status:-0}
      # Kalem's reading against pandoc's on the root documents (T2.7h.32).
      - name: Against pandoc
        run: |
          sudo apt-get install -y -qq pandoc > /dev/null
          grep -rl --include=*.tex '\\documentclass' .cache/arxiv | while read -r f; do
            [ "$(stat -c %s "$f")" -lt 400000 ] && echo "$f"
          done > roots.txt
          xargs -a roots.txt -d '\n' ./target/release/kalem diff-pandoc --summary > pandoc.txt 2>&1 || true
          tail -n 30 pandoc.txt
          { echo; echo '## Against pandoc'; echo; echo '```'; tail -n 30 pandoc.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # The licence of each paper (T2.7h.30), in the log and the summary:
      # the papers under CC BY, CC BY-SA or CC0 may be committed to the
      # corpus with the licence register.
      - name: Licences
        if: github.event.inputs.licences == 'true'
        run: |
          python3 tools/arxiv-licences.py .cache/arxiv > licences.tsv
          grep -E 'creativecommons.org/(licenses/by/|licenses/by-sa/|publicdomain/zero/)' licences.tsv | tee free.tsv
          { echo; echo '## Papers that may be committed'; echo; echo '```'; cat free.tsv; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: arxiv-coverage
          path: |
            coverage.md
            latex-limitations.org
            roundtrip.txt
            pandoc.txt
            licences.tsv
