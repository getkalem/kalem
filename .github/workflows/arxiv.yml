name: arXiv coverage

# T2.7h.1: how much of a stratified sample of arXiv's LaTeX sources the
# rendered view covers. Run by hand (and monthly); about an hour, most of
# it the pause arXiv asks for between requests. The report is in the
# job's log and its artifact; the sources are not kept.

on:
  workflow_dispatch:
    inputs:
      debug_macros:
        description: "Macro names (without backslash) to trace: why formulas find them undefined"
        required: false
        default: ""
      show_errors:
        description: "Formula errors (|-separated parts) to print the prepared source of"
        required: false
        default: ""
      per_field:
        description: Papers per field
        default: "200"
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p kalem-editor --no-default-features --features tui
      # Restored and saved separately: what was fetched is kept even when
      # arXiv stops answering partway, and the next run starts from it.
      - uses: actions/cache/restore@v4
        with:
          path: .cache/arxiv
          key: arxiv-2024-${{ github.event.inputs.per_field || '200' }}-
          restore-keys: arxiv-2024-${{ github.event.inputs.per_field || '200' }}-
      - name: Fetch the sample
        run: python3 tools/arxiv-sample.py .cache/arxiv --per-field "${{ github.event.inputs.per_field || '200' }}"
      # Saved under a key of what the sample holds: an unchanged sample is
      # not saved again (each copy saved under a new key pushed the older
      # ones, and Rust's, out of the repository's cache, and the next run
      # fetched the whole sample again).
      - name: What the sample holds
        id: sample
        if: always()
        run: echo "hash=$(find .cache/arxiv -type f | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/arxiv
          key: arxiv-2024-${{ github.event.inputs.per_field || '200' }}-${{ steps.sample.outputs.hash }}
      - name: Measure
        env:
          KALEM_COVERAGE_TRACE: ${{ github.event.inputs.debug_macros }}
          KALEM_COVERAGE_SHOW: ${{ github.event.inputs.show_errors }}
        run: |
          ./target/release/kalem latex-coverage .cache/arxiv > coverage.md
          cat coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: arxiv-coverage
          path: coverage.md
