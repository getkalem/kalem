version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Each pull request runs all of CI, and dependabot rebases every open
    # one when Cargo.lock moves on main: the week's minor and patch
    # updates come as one pull request, major updates one by one
    # (docs/ci_todo.md, C3). A breaking 0.x update fails the group's pull
    # request; then `@dependabot ignore this dependency` there, or make
    # the change on main.
    groups:
      # gpui and its platform layer are one snapshot of a Zed release tag:
      # they move together (roadmap R2.7).
      gpui:
        patterns:
          - "gpui-unofficial"
          - "gpui-platform-gpui-unofficial"
      cargo:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
    # A version bump changes no chapter of the Book: the Book workflow
    # skips its check of the changed code's chapters on this label.
    labels: ["dependencies", "rust", "book-unchanged"]
    ignore:
      # wasmtime and cranelift still hash with sha2 0.10: a 0.11 of Kalem's
      # own would put a second copy in the binary, whose size ceilings are
      # thin (tools/binary-size.txt). Take the bump when wasmtime moves.
      - dependency-name: "sha2"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # kalem-components' build script reads the components with
      # wasmparser, whose API changes between 0.x versions (0.261 renamed
      # the field of an import's name): dependabot cannot make the change,
      # and in the group it would fail every other update with it. Bump it
      # by hand.
      - dependency-name: "wasmparser"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # All of a month's updates in one pull request (docs/ci_todo.md, C3).
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      # Its tags name Rust's versions, not the action's: `@1.96` is the
      # minimum supported Rust version, moved on purpose (the MSRV job).
      - dependency-name: "dtolnay/rust-toolchain"
