version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    # Each pull request runs all of CI, and dependabot rebases every open
    # one when Cargo.lock moves on main: the month's updates come as at
    # most three pull requests (docs/ci_todo.md, C3 and C8), gpui's, the
    # minor and patch updates', and the major updates'. Dependabot counts
    # a 0.x crate's minor update (0.23 to 0.24) as major, as Cargo does, so
    # the updates that can break come together, apart from the safe ones.
    groups:
      # gpui and its platform layer are one snapshot of a Zed release tag:
      # they move together (roadmap R2.7).
      gpui:
        patterns:
          - "gpui-unofficial"
          - "gpui-platform-gpui-unofficial"
      cargo:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
      # One crate's break fails this pull request alone: fix it there, or
      # ignore that version below until it is taken by hand.
      cargo-major:
        patterns:
          - "*"
        update-types: ["major"]
    # A version bump changes no chapter of the Book: the Book workflow
    # skips its check of the changed code's chapters on this label.
    labels: ["dependencies", "rust", "book-unchanged"]
    ignore:
      # wasmtime and cranelift still hash with sha2 0.10: a 0.11 of Kalem's
      # own would put a second copy in the binary, whose size ceilings are
      # thin (tools/binary-size.txt). Take the bump when wasmtime moves.
      - dependency-name: "sha2"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # All of a month's updates in one pull request (docs/ci_todo.md, C3).
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      # Its tags name Rust's versions, not the action's: `@1.96` is the
      # minimum supported Rust version, moved on purpose (the MSRV job).
      - dependency-name: "dtolnay/rust-toolchain"
