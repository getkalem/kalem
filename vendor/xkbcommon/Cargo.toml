# xkbcommon 0.8.0 from crates.io with Kalem's one change (README.md):
# libxkbcommon and libxkbcommon-x11 are opened at run time instead of
# linked. The workspace's Cargo.toml puts it in place of the crates.io
# release through [patch.crates-io].
[package]
name = "xkbcommon"
version = "0.8.0"
authors = ["Remi THEBAULT <remi.thebault@gmail.com>"]
description = "Rust bindings and wrappers for libxkbcommon"
repository = "https://github.com/rust-x-bindings/xkbcommon-rs"
readme = "README.md"
keywords = ["keyboard", "x11", "wayland", "xcb", "input"]
license = "MIT"
edition = "2021"
publish = false

[dependencies]
libc = "0.2.148"
memmap2 = { version = "0.9.0", optional = true }
as-raw-xcb-connection = { version = "1.0", optional = true }
xkeysym = "0.2.0"

[features]
default = ["wayland"]
x11 = ["as-raw-xcb-connection"]
wayland = ["memmap2"]
