# Doom Emacs 3.0's leader map (`SPC` with Evil; modules/config/default)
# and what each key does in Kalem with Vim keys (T2.7i.1). `keys` is the
# key in Kalem's notation; `command` the command it runs, or `reason` why
# it does not: a task of section 2.7i when it is planned, or why Kalem
# will not have it. The test in `kalem_core::key_tables` checks every row
# against the Vim keymap in an Org document of a project; the Keys
# chapter of the Book shows the table. The local leader `SPC m` is
# T2.7i.16 and T2.7i.17.


