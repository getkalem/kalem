# Doom Emacs's local leader `SPC m` (`:lang org`, `:lang latex`,
# `:lang markdown`, `:lang data` for CSV) and what each key does in Kalem with Vim keys
# (T2.7i.16, T2.7i.17). `mode` is the kind of document the key is for;
# the rest is as in doom-leader.toml. The test in
# `kalem_core::key_tables` checks each row against the Vim keymap in a
# document of that mode.


