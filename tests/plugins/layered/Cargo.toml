[package]
name = "kalem-plugin-layered"
version = "0.0.0"
edition = "2024"
publish = false
description = "An extension plugin for tests: a layer over a mode's view and the clock (API 0.2.10)"

[lib]
crate-type = ["cdylib"]

[dependencies]
kalem-plugin = { path = "../../../crates/kalem-plugin", features = ["layer"] }

[profile.release]
opt-level = "s"
panic = "abort"
strip = "symbols"

# Built for wasm32-unknown-unknown by `kalem-script`'s tests, apart from
# the workspace.
[workspace]
