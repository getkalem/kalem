[package]
name = "kalem-plugin-layered"
version = "0.0.0"
edition = "2024"
publish = false
description = "An extension plugin for tests: a layer over a mode's view, the clock (API 0.2.10), a completer (API 0.2.11), lines under lines (API 0.2.13) that show a file's text (API 0.2.15) and start blocks of its outline (API 0.2.18), text at places of a line (API 0.2.20), a formatter (API 0.2.16)"

[lib]
crate-type = ["cdylib"]

[dependencies]
kalem-plugin = { path = "../../../crates/kalem-plugin", features = ["layer-5"] }

[profile.release]
opt-level = "s"
panic = "abort"
strip = "symbols"

# Built for wasm32-unknown-unknown by `kalem-script`'s tests, apart from
# the workspace.
[workspace]
