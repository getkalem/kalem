[package]
name = "kalem-plugin-sheet"
version = "0.0.0"
edition = "2024"
publish = false
description = "A fake spreadsheet for tests: a sheet of cells, a chart and a macro, exported through kalem-plugin's `grid` (T3.7.4)"

[lib]
crate-type = ["cdylib"]

[dependencies]
kalem-plugin = { path = "../../../crates/kalem-plugin", features = ["grid"] }
kalem-viewer = { path = "../../../crates/kalem-viewer" }

[profile.release]
opt-level = "s"
panic = "abort"
strip = "symbols"

# Built for wasm32-unknown-unknown by `kalem-script`'s tests, apart from
# the workspace.
[workspace]
