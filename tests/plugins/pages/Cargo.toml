[package]
name = "kalem-plugin-pages"
version = "0.0.0"
edition = "2024"
publish = false
description = "A fake viewer for tests: numbered pages with a known text, built against kalem-plugin (T3.1.3, T3.7.1)"

[lib]
crate-type = ["cdylib"]

[dependencies]
kalem-plugin = { path = "../../../crates/kalem-plugin" }

[profile.release]
opt-level = "s"
panic = "abort"
strip = "symbols"

# Built for wasm32-unknown-unknown by `kalem-script`'s tests, apart from
# the workspace.
[workspace]
