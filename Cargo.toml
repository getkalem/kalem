[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/getkalem/kalem"
homepage = "https://getkalem.github.io/kalem"
authors = ["The Kalem Contributors"]

[workspace.dependencies]
# gpui and its platform layer from crates.io: `gpui-unofficial` publishes
# gpui from each of Zed's release tags, AccessKit included, so building
# needs no clone of Zed's repository (roadmap R2.7). Pinned exactly; move
# it on purpose (R6.4).
gpui = { package = "gpui-unofficial", version = "=1.22.0" }
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.22.0" }
# Canonical paths without Windows's `\\?\` prefix where it is not needed.
dunce = "1"
org-syntax = { path = "crates/org-syntax", version = "0.0.1" }
# Markdown (D19): Kalem's fork of comrak, with the sourcepos fixes an editor
# needs (T2.7c.1a), pinned to a commit of its `kalem-main` branch.
comrak = { git = "https://github.com/getkalem/comrak", rev = "9f854603485a72b5fb17dd3a27d92679e92fe551", default-features = false }
org-model = { path = "crates/org-model", version = "0.0.1" }
org-edit = { path = "crates/org-edit", version = "0.0.1" }
org-table = { path = "crates/org-table", version = "0.0.1" }
org-math = { path = "crates/org-math", version = "0.0.1" }
org-export = { path = "crates/org-export", version = "0.0.1" }
org-cite = { path = "crates/org-cite", version = "0.0.1" }
kalem-cli = { path = "crates/kalem-cli", version = "0.0.1", default-features = false }
kalem-core = { path = "crates/kalem-core", version = "0.0.1" }
kalem-project = { path = "crates/kalem-project", version = "0.0.1" }
kalem-fs = { path = "crates/kalem-fs", version = "0.0.1" }
kalem-tui = { path = "crates/kalem-tui", version = "0.0.1" }
kalem-ui = { path = "crates/kalem-ui", version = "0.0.1" }
kalem-highlight = { path = "crates/kalem-highlight", version = "0.0.1" }
kalem-lsp = { path = "crates/kalem-lsp", version = "0.0.1" }
tui-rich-text = { path = "crates/tui-rich-text", version = "0.0.1" }
gpui-rich-text = { path = "crates/gpui-rich-text", version = "0.0.1" }
latex-syntax = { path = "crates/latex-syntax", version = "0.0.1" }
latex-model = { path = "crates/latex-model", version = "0.0.1" }
kalem-viewer = { path = "crates/kalem-viewer", version = "0.0.1" }
kalem-script = { path = "crates/kalem-script", version = "0.0.1" }
kalem-plugin = { path = "crates/kalem-plugin", version = "0.0.1" }
kalem-components = { path = "crates/kalem-components", version = "0.0.1" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Cold code, sized rather than sped (roadmap R2.1): the plugins' compiler
# (Wasmtime, Cranelift; a component compiles once into the cache), the
# workbook engine, the citation styles. The picture and PDF decoders stay
# fast: a page is drawn as it is turned.
[profile.release.package.wasmtime]
opt-level = "s"
[profile.release.package."wasmtime-environ"]
opt-level = "s"
[profile.release.package."wasmtime-internal-cranelift"]
opt-level = "s"
[profile.release.package."wasmtime-internal-core"]
opt-level = "s"
[profile.release.package."wasmtime-internal-unwinder"]
opt-level = "s"
[profile.release.package."cranelift-codegen"]
opt-level = "s"
[profile.release.package."cranelift-assembler-x64"]
opt-level = "s"
[profile.release.package."cranelift-frontend"]
opt-level = "s"
[profile.release.package."cranelift-entity"]
opt-level = "s"
[profile.release.package."cranelift-bforest"]
opt-level = "s"
[profile.release.package.regalloc2]
opt-level = "s"
[profile.release.package.wasmparser]
opt-level = "s"
[profile.release.package."pulley-interpreter"]
opt-level = "s"
[profile.release.package.wasmprinter]
opt-level = "s"
[profile.release.package.citationberg]
opt-level = "s"
[profile.release.package.hayagriva]
opt-level = "s"
[profile.release.package.serde_path_to_error]
opt-level = "s"
# On Linux and Windows: the shader translator, which runs as the window
# opens; the accessibility bus (AT-SPI over D-Bus), which answers screen
# readers (publish_todo 1.1: the full build had passed its ceiling).
[profile.release.package.naga]
opt-level = "s"
[profile.release.package.zbus]
opt-level = "s"
[profile.release.package.zvariant]
opt-level = "s"
[profile.release.package.atspi-common]
opt-level = "s"
[profile.release.package.atspi-proxies]
opt-level = "s"
[profile.release.package.accesskit_atspi_common]
opt-level = "s"
[profile.release.package.accesskit_unix]
opt-level = "s"

# Debug builds draw PDF pages and decode pictures 40 times faster with the
# rasterizer and the decoders built optimized; Kalem's own code stays a
# debug build.
[profile.dev.package."hayro-interpret"]
opt-level = 3
[profile.dev.package."hayro-syntax"]
opt-level = 3
[profile.dev.package."hayro-cmap"]
opt-level = 3
[profile.dev.package."hayro-ccitt"]
opt-level = 3
[profile.dev.package."hayro-jbig2"]
opt-level = 3
[profile.dev.package."hayro-jpeg2000"]
opt-level = 3
[profile.dev.package."hayro-postscript"]
opt-level = 3
[profile.dev.package.fearless_simd]
opt-level = 3
[profile.dev.package.kurbo]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
[profile.dev.package."read-fonts"]
opt-level = 3
[profile.dev.package."font-types"]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package."zlib-rs"]
opt-level = 3
[profile.dev.package."zune-jpeg"]
opt-level = 3
[profile.dev.package."zune-inflate"]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package."simd-adler32"]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.moxcms]
opt-level = 3
[profile.dev.package."kalem-viewer"]
opt-level = 3
# A workbook's grid is drawn anew at every step of the cursor: gpui and its
# layout engine built optimized keep a held arrow key from piling up (a
# step in a 36,000-cell sheet took 100 ms in a debug build, 10 in a release
# one).
[profile.dev.package.gpui-unofficial]
opt-level = 3
[profile.dev.package.taffy]
opt-level = 3
# The plugins' engine (kalem-script): a debug build compiles the PDF
# viewer's component in 7 s, an optimized engine in half a second.
[profile.dev.package.wasmtime]
opt-level = 3
[profile.dev.package."wasmtime-environ"]
opt-level = 3
[profile.dev.package."wasmtime-internal-cranelift"]
opt-level = 3
[profile.dev.package."wasmtime-internal-core"]
opt-level = 3
[profile.dev.package."wasmtime-internal-unwinder"]
opt-level = 3
[profile.dev.package."cranelift-codegen"]
opt-level = 3
[profile.dev.package."cranelift-frontend"]
opt-level = 3
[profile.dev.package."cranelift-entity"]
opt-level = 3
[profile.dev.package."cranelift-bforest"]
opt-level = 3
[profile.dev.package."cranelift-bitset"]
opt-level = 3
[profile.dev.package."cranelift-control"]
opt-level = 3
[profile.dev.package."cranelift-native"]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
# The host's side of the components' functions (the bindings, generic code
# of wasmtime's instantiated here): a page's 4 MB of pixels lifted out of
# a component took 40 ms in a debug build (wasm_todo W6).
[profile.dev.package."kalem-script"]
opt-level = 3

[profile.bench]
debug = true

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

# The profile cargo-dist builds the release archives with: the release
# profile, as the binary size job measures it.
[profile.dist]
inherits = "release"

# Release automation (§17): `dist generate` writes the release workflow from
# this; see docs/releasing.md.
[workspace.metadata.dist]
cargo-dist-version = "0.28.0"
ci = "github"
# No Homebrew formula until a tap exists (getkalem/homebrew-tap).
installers = ["shell", "powershell"]
# The terminal-only archives, built by a workflow of their own and
# attached to the release once it is announced.
post-announce-jobs = ["./release-terminal"]
# Dependabot updates the actions of the generated workflow too; run
# `dist generate` without this line after changing the configuration.
allow-dirty = ["ci"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
install-path = "CARGO_HOME"
# Beside the README and the licences in every archive
# (tools/third-party-licenses.sh writes it).
include = ["THIRD-PARTY-LICENSES.md"]
# The graphical editor links against the windowing libraries.
[workspace.metadata.dist.dependencies.apt]
libxkbcommon-dev = "*"
libxkbcommon-x11-dev = "*"
libwayland-dev = "*"
libx11-xcb-dev = "*"
libxcb1-dev = "*"
libfontconfig-dev = "*"
libfreetype-dev = "*"
libvulkan-dev = "*"

# Each target on a runner of its own architecture: gpui is not
# cross-compiled, and GitHub retired dist's default ubuntu-20.04.
[workspace.metadata.dist.github-custom-runners]
global = "ubuntu-22.04"
aarch64-apple-darwin = "macos-14"
x86_64-apple-darwin = "macos-15-intel"
aarch64-unknown-linux-gnu = "ubuntu-22.04-arm"
x86_64-unknown-linux-gnu = "ubuntu-22.04"
x86_64-pc-windows-msvc = "windows-2022"
