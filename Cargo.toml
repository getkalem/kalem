[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/getkalem/kalem"
homepage = "https://getkalem.github.io/kalem"
authors = ["The Kalem Contributors"]

[workspace.dependencies]
# Canonical paths without Windows's `\\?\` prefix where it is not needed.
dunce = "1"
org-syntax = { path = "crates/org-syntax", version = "0.0.1" }
klm-syntax = { path = "crates/klm-syntax" }
# Markdown (D19): Kalem's fork of comrak, with the sourcepos fixes an editor
# needs (T2.7c.1a), pinned to a commit of its `kalem-main` branch.
comrak = { git = "https://github.com/getkalem/comrak", rev = "9f854603485a72b5fb17dd3a27d92679e92fe551", default-features = false }
org-model = { path = "crates/org-model", version = "0.0.1" }
org-edit = { path = "crates/org-edit", version = "0.0.1" }
org-table = { path = "crates/org-table", version = "0.0.1" }
org-math = { path = "crates/org-math", version = "0.0.1" }
org-export = { path = "crates/org-export", version = "0.0.1" }
org-cite = { path = "crates/org-cite", version = "0.0.1" }
kalem-cli = { path = "crates/kalem-cli", version = "0.0.1" }
kalem-core = { path = "crates/kalem-core", version = "0.0.1" }
kalem-project = { path = "crates/kalem-project", version = "0.0.1" }
kalem-fs = { path = "crates/kalem-fs", version = "0.0.1" }
kalem-tui = { path = "crates/kalem-tui", version = "0.0.1" }
kalem-ui = { path = "crates/kalem-ui", version = "0.0.1" }
kalem-highlight = { path = "crates/kalem-highlight", version = "0.0.1" }
kalem-lsp = { path = "crates/kalem-lsp", version = "0.0.1" }
tui-rich-text = { path = "crates/tui-rich-text", version = "0.0.1" }
gpui-rich-text = { path = "crates/gpui-rich-text", version = "0.0.1" }
latex-syntax = { path = "crates/latex-syntax", version = "0.0.1" }
latex-model = { path = "crates/latex-model", version = "0.0.1" }
kalem-viewer = { path = "crates/kalem-viewer", version = "0.0.1" }
kalem-script = { path = "crates/kalem-script", version = "0.0.1" }
kalem-plugin = { path = "crates/kalem-plugin", version = "0.0.1" }
# The image viewer, a plugin of getkalem/plugins bundled into the binary
# (D28) until components load (T3.1.12).
kalem-plugin-image-viewer = { git = "https://github.com/getkalem/plugins", rev = "1d34eef4f98a9392d3316f2467f6a008d675c689" }
# Excel workbooks (T3.7.4), bundled the same way.
kalem-plugin-xlsx = { git = "https://github.com/getkalem/plugins", rev = "7eb7336f207feebb4943782ea6c78bc89e195d97" }
# PDF files (T3.7.3), bundled the same way.
kalem-plugin-pdf-viewer = { git = "https://github.com/getkalem/plugins", rev = "6e7cef2747f8495eedcdfa4093ca24d2c151fb5a" }

# The plugins build against this checkout's contract, not its copy on
# GitHub.
[patch."https://github.com/getkalem/kalem"]
kalem-viewer = { path = "crates/kalem-viewer" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Debug builds draw PDF pages and decode pictures 40 times faster with the
# rasterizer, the decoders and the PDF viewer built optimized; Kalem's own
# code stays a debug build.
[profile.dev.package.hayro]
opt-level = 3
[profile.dev.package."hayro-interpret"]
opt-level = 3
[profile.dev.package."hayro-syntax"]
opt-level = 3
[profile.dev.package."hayro-cmap"]
opt-level = 3
[profile.dev.package."hayro-ccitt"]
opt-level = 3
[profile.dev.package."hayro-jbig2"]
opt-level = 3
[profile.dev.package."hayro-jpeg2000"]
opt-level = 3
[profile.dev.package."hayro-postscript"]
opt-level = 3
[profile.dev.package.vello_cpu]
opt-level = 3
[profile.dev.package.vello_common]
opt-level = 3
[profile.dev.package.fearless_simd]
opt-level = 3
[profile.dev.package.kurbo]
opt-level = 3
[profile.dev.package.peniko]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
[profile.dev.package."read-fonts"]
opt-level = 3
[profile.dev.package."font-types"]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package."zlib-rs"]
opt-level = 3
[profile.dev.package."zune-jpeg"]
opt-level = 3
[profile.dev.package."zune-inflate"]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.moxcms]
opt-level = 3
[profile.dev.package."pic-scale"]
opt-level = 3
[profile.dev.package."kalem-plugin-pdf-viewer"]
opt-level = 3
[profile.dev.package."kalem-viewer"]
opt-level = 3
# The plugins' engine (kalem-script): a debug build compiles the PDF
# viewer's component in 7 s, an optimized engine in half a second.
[profile.dev.package.wasmtime]
opt-level = 3
[profile.dev.package."wasmtime-environ"]
opt-level = 3
[profile.dev.package."wasmtime-internal-cranelift"]
opt-level = 3
[profile.dev.package."wasmtime-internal-core"]
opt-level = 3
[profile.dev.package."wasmtime-internal-unwinder"]
opt-level = 3
[profile.dev.package."cranelift-codegen"]
opt-level = 3
[profile.dev.package."cranelift-frontend"]
opt-level = 3
[profile.dev.package."cranelift-entity"]
opt-level = 3
[profile.dev.package."cranelift-bforest"]
opt-level = 3
[profile.dev.package."cranelift-bitset"]
opt-level = 3
[profile.dev.package."cranelift-control"]
opt-level = 3
[profile.dev.package."cranelift-native"]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3

[profile.bench]
debug = true

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

# Release automation (§17): `dist generate` writes the release workflow from
# this; see docs/releasing.md.
[workspace.metadata.dist]
cargo-dist-version = "0.28.0"
ci = "github"
installers = ["shell", "powershell", "homebrew"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
install-path = "CARGO_HOME"
