<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Kalem</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b4c7e"/>
      <stop offset="1" stop-color="#162a4a"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d98a"/>
      <stop offset="0.5" stop-color="#e8b84a"/>
      <stop offset="1" stop-color="#c8922a"/>
    </linearGradient>
  </defs>
  <!-- The tile, as macOS draws app icons: 824 points on a 1024 grid. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- The letter nūn (ن), as a reed pen writes it: a bowl, thick at its
       bottom and thin at its two ends, and its dot above. Drawn as
       outlines, so that no font is needed. -->
  <path d="M286 452
           C 262 650, 372 782, 512 782
           C 664 782, 778 664, 750 424
           C 744 412, 726 410, 718 422
           C 716 604, 628 694, 512 694
           C 404 694, 330 622, 316 466
           C 312 450, 292 444, 286 452 Z"
        fill="url(#ink)"/>
  <!-- The dot: a diamond, a nib's width on each side. -->
  <path d="M512 262 L 572 322 L 512 382 L 452 322 Z" fill="url(#ink)"/>
</svg>
